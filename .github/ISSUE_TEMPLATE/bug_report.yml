name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues
        first, and fill in as much detail as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or keystrokes that trigger it.
      placeholder: |
        1. Start opencode with ember loaded
        2. Run `/keepwarm 1h`
        3. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste any error text or logs. Redact anything private.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Warmth never starts, or stops early
        - Cold guard misprices or does not block
        - "`/keepwarm` command"
        - "`/ember` card or `ember gain` report"
        - "Installer (`install.sh`)"
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `opencode --version` and your OS. Include the model/provider if the report or pricing is involved.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
